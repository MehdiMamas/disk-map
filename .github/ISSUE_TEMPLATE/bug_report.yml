name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw. A screenshot helps.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Disk Map version
      description: From the Releases page name of the installer you used, for example 0.1.5.
    validations:
      required: true
